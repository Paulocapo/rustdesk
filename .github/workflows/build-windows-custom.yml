name: Build MSP-Soporte (Windows x64)

# Ejecucion manual desde la pestana "Actions" del repositorio.
on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: 'Publicar en el VPS (canal de actualizaciones propio) para que los clientes vean el aviso.'
        type: boolean
        default: false

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  # Valores del servidor propio (tambien hardcodeados en libs/hbb_common/src/config.rs).
  # Se inyectan como variables de entorno por seguridad adicional / trazabilidad.
  RS_PUB_KEY: "nobrqkzPZgadNZJ3AQYP4sRJJ2DUJ2iVnl8SnxZbB18="
  RENDEZVOUS_SERVERS: "147.15.29.197"

jobs:
  # Reutiliza el workflow oficial que genera el flutter_rust_bridge (no se modifico).
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # Reutiliza el workflow oficial del componente de ventana "always on top".
  build-topmostwindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Build MSP-Soporte Windows x64
    needs: [generate-bridge, build-topmostwindow]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # El tag del release sale del env VERSION. Si no coincide con Cargo.toml, los clientes
      # nunca verian la actualizacion: se corta el build con un error claro.
      - name: Verificar VERSION vs Cargo.toml
        shell: bash
        run: |
          V=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "Cargo.toml: $V | env VERSION: ${{ env.VERSION }}"
          if [ "$V" != "${{ env.VERSION }}" ]; then
            echo "::error::El env VERSION (${{ env.VERSION }}) no coincide con Cargo.toml ($V). Actualizar 'VERSION:' en el workflow."
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        env:
          # Token del canal de actualizaciones propio (se embebe en el binario; no va al repo).
          CUSTOM_UPDATE_TOKEN: ${{ secrets.CUSTOM_UPDATE_TOKEN }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./MSP-Soporte

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./MSP-Soporte"

      - name: Build self-extracted executable (instalador)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../MSP-Soporte/ -o . -e ../../MSP-Soporte/MSP-Soporte.exe
          popd
          mkdir -p ./output
          mv ./target/release/rustdesk-portable-packer.exe ./output/MSP-Soporte-${{ env.VERSION }}-x86_64-install.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MSP-Soporte-${{ env.VERSION }}-x86_64-install
          path: ./output/MSP-Soporte-${{ env.VERSION }}-x86_64-install.exe
          if-no-files-found: error

      - name: Upload portable artifact (carpeta comprimida automaticamente)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MSP-Soporte-${{ env.VERSION }}-x86_64-portable
          path: ./MSP-Soporte

      # Canal propio: sube el instalador + latest.json al VPS (nginx, HTTPS + token en la ruta).
      # Secrets necesarios: VPS_SSH_KEY (clave privada) y CUSTOM_UPDATE_TOKEN.
      - name: Publicar en el VPS (opcional)
        if: ${{ inputs.publish_update }}
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          TOKEN: ${{ secrets.CUSTOM_UPDATE_TOKEN }}
          TAG: ${{ env.VERSION }}
          CHANNEL: msp
        run: |
          set -euo pipefail
          FILE="MSP-Soporte-${TAG}-x86_64-install.exe"
          SRC="./output/${FILE}"
          [ -f "$SRC" ] || { echo "::error::No existe $SRC"; exit 1; }
          SHA=$(sha256sum "$SRC" | cut -d' ' -f1)
          printf '{"version":"%s","url":"https://147.15.29.197/u/%s/%s/%s","sha256":"%s"}\n' \
            "$TAG" "$TOKEN" "$CHANNEL" "$FILE" "$SHA" > latest.json
          mkdir -p ~/.ssh && printf '%s\n' "$VPS_KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 147.15.29.197 >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/vps_key "$SRC" latest.json "ubuntu@147.15.29.197:/home/ubuntu/updates/${CHANNEL}/"
          echo "Publicado en el VPS: ${TAG} (${CHANNEL})" >> "$GITHUB_STEP_SUMMARY"
          if-no-files-found: error
