name: Build MSP-Soporte (Android APK)

# Compila el APK de Android (MSP-Soporte) para instalar en el telefono.
# Firmado con la clave de debug -> instalable activando "origenes desconocidos".
on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: 'Publicar en el VPS (canal Android) para que el aviso del telefono baje el APK.'
        type: boolean
        default: false

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    name: Build MSP-Soporte APK (${{ matrix.job.arch }})
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: arm64-v8a, target: aarch64-linux-android, platform: android-arm64 }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          case ${{ matrix.job.target }} in
            aarch64-linux-android) ANDROID_TARGET=arm64-v8a ;;
            armv7-linux-androideabi) ANDROID_TARGET=armeabi-v7a ;;
          esac
          ./flutter/build_android_deps.sh "${ANDROID_TARGET}"
        shell: bash

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              ./flutter/ndk_arm64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            ;;
            armv7-linux-androideabi)
              ./flutter/ndk_arm.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            ;;
          esac

      - name: Version del APK (informativo)
        shell: bash
        run: |
          LINE=$(grep -m1 '^version:' flutter/pubspec.yaml)
          CODE=$(echo "$LINE" | sed -E 's/.*\+([0-9]+).*/\1/')
          echo "### APK a compilar" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- pubspec: \`$LINE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: **$CODE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- artefacto: MSP-Soporte-${{ env.VERSION }}-arm64-v8a.apk" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" = "1" ]; then
            echo "::warning::versionCode = 1 (local.properties sin build number). Revisar flutter/pubspec.yaml."
          fi

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Firma: si hay keystore en secrets -> firma FIJA (permite actualizar encima). Si no, debug.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ./flutter/android/app/msp-release.jks
            echo "$ANDROID_KEY_PROPERTIES_BASE64" | base64 -d > ./flutter/android/key.properties
            echo "Firmando con keystore propio (firma fija)."
          else
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
            echo "AVISO: sin keystore en secrets; firmando con debug (no permite actualizar encima)."
          fi
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
            ;;
            armv7-linux-androideabi)
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
            ;;
          esac
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.platform }} --split-per-abi
          popd

      - name: Renombrar APK
        shell: bash
        run: |
          mkdir -p output
          case ${{ matrix.job.arch }} in
            arm64-v8a) SRC=./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ;;
            armeabi-v7a) SRC=./flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ;;
          esac
          cp "$SRC" "./output/MSP-Soporte-${{ env.VERSION }}-${{ matrix.job.arch }}.apk"
          ls -l ./output

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MSP-Soporte-${{ env.VERSION }}-${{ matrix.job.arch }}-apk
          path: ./output/MSP-Soporte-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
          if-no-files-found: error

      # Canal Android: el aviso del telefono debe apuntar al .apk (no al instalador de Windows).
      # Secrets necesarios: VPS_SSH_KEY y CUSTOM_UPDATE_TOKEN.
      - name: Publicar APK en el VPS (opcional)
        if: ${{ inputs.publish_update }}
        shell: bash
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          TOKEN: ${{ secrets.CUSTOM_UPDATE_TOKEN }}
          TAG: ${{ env.VERSION }}
          ARCH: ${{ matrix.job.arch }}
          CHANNEL: msp-android
        run: |
          set -euo pipefail
          FILE="MSP-Soporte-${TAG}-${ARCH}.apk"
          SRC="./output/${FILE}"
          [ -f "$SRC" ] || { echo "::error::No existe $SRC"; exit 1; }
          SHA=$(sha256sum "$SRC" | cut -d' ' -f1)
          printf '{"version":"%s","url":"https://147.15.29.197/u/%s/%s/%s","sha256":"%s"}\n' \
            "$TAG" "$TOKEN" "$CHANNEL" "$FILE" "$SHA" > latest.json
          mkdir -p ~/.ssh && printf '%s\n' "$VPS_KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 147.15.29.197 >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/vps_key "$SRC" latest.json "ubuntu@147.15.29.197:/home/ubuntu/updates/${CHANNEL}/"
          # Retencion: conservar solo las 5 versiones mas nuevas del canal (APK).
          ssh -i ~/.ssh/vps_key ubuntu@147.15.29.197 \
            "ls -1t /home/ubuntu/updates/${CHANNEL}/*.apk 2>/dev/null | tail -n +6 | xargs -r rm -f"
          echo "APK publicado en el VPS: ${TAG} (${ARCH})" >> "$GITHUB_STEP_SUMMARY"
