name: Update from upstream RustDesk

# Mergea una version nueva de RustDesk upstream en una rama y abre un Pull Request.
# NO toca 'master' directamente: vos revisas y mergeas el PR. Despues recompilas.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag o rama de RustDesk upstream (ej. 1.5.2). Vacio = ultimo master.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Merge de upstream y abrir PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch upstream --tags
          TARGET="upstream/master"
          if [ -n "$REF" ]; then TARGET="upstream/$REF"; fi
          BRANCH="update/upstream-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          if ! git merge "$TARGET" --no-edit; then
            echo "::error::Hay CONFLICTOS al mergear $TARGET. Se cancela el merge. Resolver manualmente (revisar libs/hbb_common, src/common.rs, libs/hbb_common/src/config.rs)."
            git merge --abort
            exit 1
          fi

          # --- Version del APK (Android): sube SOLO en este flujo, o sea solo cuando hay
          # actualizacion de RustDesk. Si no se actualiza, este workflow no corre y el
          # versionCode no cambia.
          if [ -f flutter/pubspec.yaml ]; then
            NEW_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
            OLD_BUILD=$(grep -m1 '^version:' flutter/pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
            if ! echo "$OLD_BUILD" | grep -qE '^[0-9]+$'; then OLD_BUILD=0; fi
            NEW_BUILD=$((OLD_BUILD + 1))
            if [ -n "$NEW_VER" ]; then
              sed -i -E "s/^version:.*/version: ${NEW_VER}+${NEW_BUILD}/" flutter/pubspec.yaml
              git add flutter/pubspec.yaml
              git commit -m "APK: subir version a ${NEW_VER}+${NEW_BUILD} (versionCode ${NEW_BUILD})"
              echo "APK version: ${NEW_VER}+${NEW_BUILD} (versionCode ${NEW_BUILD})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::No se pudo leer la version de Cargo.toml; revisar flutter/pubspec.yaml a mano."
            fi
          fi

          # Reafirmar personalizaciones clave por si el merge las piso (no deberia, pero por seguridad)
          git push origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Actualizacion desde RustDesk ($TARGET)" \
            --body "Merge automatico de $TARGET. Revisar que sigan presentes el servidor/clave, la marca/logos y el bloqueo de auto-update. Proceso completo en ACTUALIZACION.md (repo soporteremotomsp)."
