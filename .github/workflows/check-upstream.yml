name: Check RustDesk upstream updates

# Avisa si hay una version nueva oficial de RustDesk comparando con nuestra version.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *" # el dia 1 de cada mes, 12:00 UTC (mensual)

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Comparar version y avisar (si corresponde)
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            const fs = require('fs');
            const cargo = fs.readFileSync('Cargo.toml', 'utf8');
            const m = cargo.match(/^version\s*=\s*"([^"]+)"/m);
            const our = m ? m[1] : '';

            let latest = '';
            try {
              const rel = await github.rest.repos.getLatestRelease({ owner: 'rustdesk', repo: 'rustdesk' });
              latest = (rel.data.tag_name || '').replace(/^v/, '');
            } catch (e) {
              core.warning('No se pudo obtener la ultima version oficial de RustDesk: ' + e.message);
            }

            core.info('Nuestra version: ' + our + ' | Ultima oficial: ' + latest);
            if (!latest) { core.info('Sin dato de version oficial; no se hace nada.'); return; }

            const n = s => (s || '').split('.').map(x => parseInt(x) || 0);
            const [a, b, c] = n(our);
            const [x, y, z] = n(latest);
            const newer = (x > a) || (x === a && y > b) || (x === a && y === b && z > c);
            if (!newer) { core.info('Estamos al dia (version ' + our + ').'); return; }

            const title = 'Actualizacion de RustDesk disponible: ' + latest;
            const body = [
              '## Nueva version oficial de RustDesk: **' + latest + '**',
              '',
              'Nuestra version actual: **' + our + '**',
              '',
              '### Pasos para actualizar',
              '1. Ejecutar el workflow **Update from upstream RustDesk** y revisar el Pull Request.',
              '2. Verificar que sigan el servidor, la clave y la marca.',
              '3. Compilar con **Build ... (Windows x64)** y distribuir el .exe.',
              '4. Evaluar actualizar el servidor (hbbs/hbbr) en el VPS.',
              '',
              'Proceso completo en `ACTUALIZACION.md` (repo de gestion soporteremotomsp).'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(i => i.title.startsWith('Actualizacion de RustDesk disponible'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body,
              });
              core.info('Issue actualizado: #' + existing.number);
            } else {
              const r = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
              core.info('Issue creado: #' + r.data.number);
            }
